---
- name: (Full Topology) - Retrieve hostnames of workers
  hosts: "{{ group_workers_full}}"
  gather_facts: false
  tasks:
    - name: Retrieve hostname for {{ inventory_hostname }}
      shell: |
        hostname
      register: local_hostname

    - name: Add {{ inventory_hostname }} to hostname list
      set_fact:
        hostname_list: "{{ local_hostname.stdout }}"
      delegate_facts: true

#- name: Deploying application code
#  hosts: localhost
