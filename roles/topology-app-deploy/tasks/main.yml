- name: Retrieve local hostname list
  set_fact:
    workers_hostname: >
      {{ hostvars | dict2items
      | selectattr('value.local_hostname', 'defined')
      | map(attribute='value.local_hostname.stdout')
      | list }}

- name: Available hostnames display
  debug:
    msg: "Available hostnames: {{ workers_hostname }}"

- name: Print group_clusters
  debug:
    msg: "group_clusters: {{ group_clusters }}"

- name: Print group_root
  debug:
    msg: "group_root: {{ group_root }}"

- name: Set topology_desc JSON string
  set_fact:
    topology_desc_json: "{{ topology_desc | to_nice_json }}"

- name: Set workers list JSON string
  set_fact:
    workers_json: "{{ workers_hostname | list }}"

- name: Save topology_desc to a file
  ansible.builtin.copy:
    content: "{{ topology_desc_json }}"
    dest: "/tmp/topology_desc.json"

- name: Upgrade pip to the latest version
  pip:
    name: pip
    state: latest
    executable: pip3
  become: true

- name: Install Python packages from requirements.txt
  pip:
    requirements: ./utils/deploy_app/requirements.txt
    executable: /usr/local/bin/pip3
    chdir: ..
  become: true
  become_user: root

- name: Install script dependencies
  ansible.builtin.shell: |
    pip3 install -r ../utils/deploy_app/requirements.txt
  become: true
  become_user: root

- name: Execute the Python script with sudo and parameters
  command: >
    sudo /usr/bin/python3 ../utils/deploy_app/update_sla.py "/tmp/topology_desc.json" "{{ workers_json }}" "{{ group_clusters }}" "{{ group_root }}"
  register: result_output
  become: true
  become_user: root


- name: Set result_output as JSON dictionary
  set_fact:
    worker_process_dict: "{{ result_output.stdout | to_json }}"

- name: Print the worker_process_dict
  debug:
    msg: "{{ worker_process_dict }}"

- name: Check if process is running on the remote host
  ansible.builtin.shell: |
    if pgrep -f "{{ item.value }}"; then
      echo "Process "{{ item.value }}" is running"
    else
      echo "Process "{{ item.value }}" not running"
      exit 1
    fi
  args:
    warn: false
  delegate_to: "{{ item.key }}"
  with_dict: "{{ worker_process_dict | from_json }}"
  ignore_errors: false  # Set to true if you want to continue even if a process is not running

- name: Print the output of the Python script
  debug:
    msg: "{{ result_output.stdout }}"

- name: Retrieve updated topology
  ansible.builtin.slurp:
    src: "/tmp/topology_desc.json"
  register: new_topology_content

- name: Decode new topology
  set_fact:
    new_topology: "{{ new_topology_content.content | b64decode }}"

- name: Show deployed topology
  debug:
    msg: "{{ new_topology_content }}"
